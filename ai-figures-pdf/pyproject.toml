[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-figures-pdf"
version = "0.1.0"
description = "Drag-and-drop a folder of Illustrator .ai figures: export artboard 1 of each as PNG and compile one ordered PDF"
requires-python = ">=3.9"
dependencies = ["PyMuPDF>=1.23", "PySide6"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
ai-figures-pdf = "ai_figures.gui:main"
ai-figures-pdf-cli = "ai_figures.cli:main"

[tool.setuptools]
packages = ["ai_figures"]
