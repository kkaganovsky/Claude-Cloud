[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ephys-suite"
version = "0.1.0"
description = "Patch-clamp analysis suite modelled on Easy Electrophysiology: passive properties, AP counting, AP kinetics, event detection"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = ["numpy", "scipy", "pyabf", "pyqtgraph", "PySide6", "openpyxl"]

[project.optional-dependencies]
test = ["pytest", "playwright"]   # playwright is optional: the headless-Chrome test skips without it
ml = ["torch", "scikit-learn>=1.9"]   # the bundled model was pickled with scikit-learn 1.9.1

[project.scripts]
ephys-suite = "ephys_suite.__main__:main"
ephys-suite-qc = "ephys_suite.qc:main"
ephys-suite-classify = "ephys_suite.ml.infer:main"
ephys-suite-review-export = "ephys_suite.review_export:main"
ephys-suite-review-import = "ephys_suite.review_import:main"

[tool.setuptools]
packages = ["ephys_suite", "ephys_suite.ml"]

[tool.setuptools.package-data]
ephys_suite = ["review_page.html"]
"ephys_suite.ml" = ["models/*.pkl.xz", "models/*.md"]
